<style>
:root{--bg:#16120a;--pn:#221b0d;--tx:#f5e6b8;--mu:#a8956a;--ac:#e0b030;--bd:#3a3016;--on:#16120a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .25s,color .25s;padding-bottom:86px;max-width:640px;margin:auto;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 55%);z-index:-1}
h1{font-size:26px;letter-spacing:-.5px}h2{font-size:18px;margin:14px 0 8px}h3{font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}.logo b{color:var(--ac)}.logo svg{width:22px;height:22px}
#v{padding:12px 16px}
.c{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 35%,transparent),transparent 70%),var(--pn);border:1px solid var(--bd);border-radius:22px;padding:18px;margin:6px 0}
.mu{color:var(--mu);font-size:13px}.ctr{text-align:center}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.full{width:100%;padding:13px;font-size:16px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%;margin:4px 0;outline:none}
input:focus{border-color:var(--ac)}
input[type=checkbox]{width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .4s}
nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;display:flex;background:var(--pn);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 2px;font-weight:600}nav button.on{color:var(--ac)}nav span{display:block;font-size:20px}
.msg{padding:9px 12px;border-radius:16px;margin:6px 0;max-width:88%;white-space:pre-wrap;word-break:break-word}.u{background:var(--ac);color:var(--on);margin-left:auto}.a{background:var(--pn);border:1px solid var(--bd)}
.sp{background:none!important;border:0;padding:0 0 0 6px;font-size:16px;color:var(--mu)}
.ch{display:flex;align-items:flex-end;gap:5px;height:80px}.ch i{flex:1;background:var(--ac);border-radius:5px 5px 0 0;min-height:3px}
.opt{display:block;width:100%;text-align:left;margin:5px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-weight:500}
.ok{border-color:#2ecc71!important}.no{border-color:#e74c3c!important}
.lk{opacity:.45}
.chip{background:var(--pn);color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.pill{display:inline-block;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;background:var(--bd);color:var(--tx)}
.p-new{background:#1f6f43;color:#dcffe9}.p-learn{background:#7a5a10;color:#fff3cf}.p-rev{background:#8a2a2a;color:#ffe0e0}
.fl{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#ffd23f;font-size:14px;flex:none;border:1px solid var(--bd)}
.cc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:12px;margin:8px 0;font-weight:600}
.big{font-size:44px;font-weight:800;letter-spacing:-1px}
.seg{display:flex;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:3px;margin:6px 0}
.seg button{flex:1;background:none;color:var(--mu)}.seg button.on{background:var(--ac);color:var(--on)}
.ring{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--pn);display:grid;place-items:center;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:8px}
.cal b,.cal i{font-style:normal;font-weight:600;font-size:13px;line-height:30px;border-radius:50%;height:30px}
.cal u{text-decoration:none;color:var(--mu);font-size:12px}
.cal b.act{background:color-mix(in srgb,var(--ac) 35%,transparent)}.cal b.tdy{background:var(--ac);color:var(--on)}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--bd)}
.th{width:calc(50% - 4px);text-align:left;border:2px solid transparent;margin:0}
.spl{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
body.spl-on .top,body.spl-on nav{display:none}
.av{width:84px;height:84px;border-radius:50%;background:var(--pn);border:2px solid var(--ac);display:block;margin:0 auto;overflow:hidden}
.typing{display:inline-block;animation:bl 1s infinite}@keyframes bl{50%{opacity:.3}}
.gt{font-variant-numeric:tabular-nums}
</style></head><body>

function nx(){const d=D[sub];cur.k++;cur.fb=null;cur.fv="";if(cur.k>=6){cur.st=2;if(cur.ok>=3){if(!S.done[sub]){cur.gain=10+cur.ok*5;addXp(cur.gain);d[4].forEach(([w,tr])=>{if(!S.words.find(x=>x.w==w))S.words.push({w,tr,ex:"",due:dk(),int:1,err:0,st:0})})}S.done[sub]=Math.max(S.done[sub]||0,cur.ok);T0().lesson=1;save()}}draw()}
// ===== Mini-game =====
function pool(){const m={};D.forEach(d=>d[4].forEach(([w,tr])=>m[w]=tr));S.words.forEach(w=>m[w.w]=w.tr);return Object.entries(m)}
function startGame(){const p=pool();shuffle(p);const qs=p.slice(0,10).map(([w,tr])=>{const o=shuffle(p.filter(x=>x[1]!=tr)).slice(0,3).map(x=>x[1]);o.push(tr);return{w,tr,o:shuffle(o)}});
 clearInterval(gi);g={q:qs,k:0,ok:0,bad:0,t:60,fb:null,end:0};tab="home";sub="game";cur=null;
 gi=setInterval(()=>{if(!g||g.end){clearInterval(gi);return}g.t--;const e=$("gt");if(e)e.textContent=fmt(g.t);if(g.t<=0)gEnd()},1000);draw();window.scrollTo(0,0)}
function gAns(i){if(!g||g.fb||g.end)return;g.fb=1;g.pk=i;const q=g.q[g.k];if(q.o[i]==q.tr){g.ok++}else g.bad++;draw();setTimeout(()=>{if(!g||g.end)return;g.k++;g.fb=null;if(g.k>=g.q.length)gEnd();else draw()},800)}
function gEnd(){if(!g||g.end)return;g.end=1;clearInterval(gi);S.gok+=g.ok;S.gbad+=g.bad;const td=T0();g.gain=0;if(!td.game){td.game=1;g.gain=g.ok*3;if(g.gain)addXp(g.gain)}save();draw()}
function game(){if(!g)return"";const bk=`<button class="g" onclick="go('home')">← ${t("home")}</button>`;
 if(g.end)return bk+`<div class="c ctr" style="margin-top:12px"><h2>${t("res")}</h2><h1>${g.ok}/${g.q.length}</h1>${g.gain?`<p>+${g.gain} XP</p>`:`<p class="mu">${t("xpfirst")}</p>`}<div class="bar"><i style="width:${g.ok/g.q.length*100}%"></i></div></div><button class="full" onclick="startGame()">${t("again")}</button>`;
 const q=g.q[g.k];
 return bk+`<div class="row sb" style="margin:10px 0"><b>${g.k+1}/${g.q.length}</b><span class="gt mu">⏱ <span id="gt">${fmt(g.t)}</span></span></div><div class="bar"><i style="width:${g.k/g.q.length*100}%"></i></div><div class="mu" style="margin-top:14px">${t("pick")}</div><div class="row" style="margin:8px 0"><div class="big">${esc(q.w)}</div><button class="sp" onclick="speak('${esc(q.w).replace(/\\/g,"")}')">🔊</button></div>${q.o.map((o,i)=>`<button class="opt ${g.fb?(o==q.tr?"ok":g.pk==i?"no":""):""}" style="padding:14px" ${g.fb?"disabled":""} onclick="gAns(${i})">${esc(o)}</button>`).join("")}${g.fb?`<div class="c ctr ${q.o[g.pk]==q.tr?"ok":"no"}">${q.o[g.pk]==q.tr?"⭐ "+t("correct"):t("wrong")+" "+esc(q.tr)}</div>`:""}`}
// ===== Plans / Habits =====
function plans(){
 const seg=`<div class="seg">${[["goals","goals"],["habits","habits"]].map(([k,l])=>`<button class="${ptab==k?"on":""}" onclick="ptab='${k}';draw()">${t(l)}</button>`).join("")}</div>`;
 return seg+(ptab=="habits"?habitsV():goalsV())}
function goalsV(){const dn=dnDone(),p=Math.round(dn/60*100),st=t("stages"),s1=Math.round(dn/10*100);
 return`<div class="hero"><div class="mu">${t("maingoal")}</div><input value="${esc(S.goal||t("goaldef"))}" style="font-size:18px;font-weight:700;background:none;border:0;padding:4px 0" onchange="S.goal=this.value;save()"><div class="row sb"><span class="mu">${t("deadline")}</span><input type="date" value="${esc(S.gdate)}" style="width:auto;margin:0" onchange="S.gdate=this.value;save()"></div><div class="row sb" style="margin-top:8px"><div class="bar" style="flex:1"><i style="width:${p}%"></i></div><b>${p}%</b></div></div>
<h2>${t("stage").split(" · ")[0]?"":""}${t("goals")}</h2>${st.map((n,i)=>`<div class="c ${i?"lk":""}" style="padding:10px 14px;margin:6px 0"><div class="row sb"><span>${i+1}. ${n}</span><span class="mu">${i?"🔒":s1+"%"}</span></div><div class="mu">${i*10+1}–${i*10+10} ${t("days")}</div>${i?"":`<div class="bar" style="margin-top:6px"><i style="width:${s1}%"></i></div>`}</div>`).join("")}
<h2>${t("mine")}</h2>${S.plans.map((p,i)=>`<div class="c"><b>${esc(p.g)}</b> <span class="mu">${esc(p.t)} · ${esc(p.n)}/${t("perw")}</span><br>${p.k.map((k,j)=>`<label style="display:block"><input type="checkbox" ${k.x?"checked":""} onchange="S.plans[${i}].k[${j}].x=this.checked;save()"> ${esc(k.n)}</label>`).join("")}<input placeholder="${t("task")}" onkeydown="if(event.key=='Enter'&&this.value){S.plans[${i}].k.push({n:this.value,x:0});save();draw()}"><button class="g" onclick="S.plans.splice(${i},1);save();draw()">${t("del")}</button></div>`).join("")}
<div class="c"><input id="pg" placeholder="${t("goal")}"><input id="pt" type="date"><input id="pn" type="number" min="1" max="14" value="4"><button onclick="if($('pg').value){S.plans.push({g:$('pg').value,t:$('pt').value,n:$('pn').value,k:[]});save();draw()}">${t("add")}</button></div>`}
function habitsV(){const k=dk(),n=S.habits.length,dn=S.habits.filter(h=>h.d.includes(k)).length,pc=n?Math.round(dn/n*100):0;
 return`<div class="c row" style="flex-wrap:nowrap"><div class="ring" style="--p:${pc}"><b>${pc}%</b></div><div><b>${t("todaydone")}</b><div class="mu">${dn}/${n}</div></div></div>
${S.habits.map((h,i)=>`<div class="c row sb" style="flex-wrap:nowrap"><span>${esc(h.n)} <span class="mu">🔥${hs(h)}</span></span><span style="white-space:nowrap"><button class="${h.d.includes(k)?"":"g"}" onclick="hd(${i})">✓</button> <button class="g" onclick="S.habits.splice(${i},1);save();draw()">✕</button></span></div>`).join("")}
<div class="c"><input id="hn" placeholder="${t("name")}" onkeydown="if(event.key=='Enter')ha(this.value)"><button onclick="ha($('hn').value)">${t("add")}</button></div>
<b>${t("tpl")}</b><div class="row" style="margin:6px 0">${t("tplh").map((x,i)=>`<button class="chip" onclick="ha(t('tplh')[${i}])">+ ${x}</button>`).join("")}</div>${cal()}`}
function cal(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();let h="";for(let i=0;i<first;i++)h+="<i></i>";
 for(let d=1;d<=dim;d++){const k=y+"-"+pad(m+1)+"-"+pad(d);const act=S.log[k]||S.habits.some(x=>x.d.includes(k));h+=`<b class="${act?"act":""} ${d==n.getDate()?"tdy":""}">${d}</b>`}
 const wd=[1,2,3,4,5,6,7].map(i=>`<u>${new Date(2024,0,i).toLocaleDateString(LC[S.lg],{weekday:"short"})}</u>`).join("");
 return`<div class="c"><b>${n.toLocaleDateString(LC[S.lg],{month:"long",year:"numeric"})}</b><div class="cal">${wd}${h}</div></div>`}
function hs(h){let n=0,d=new Date();if(!h.d.includes(dk(d)))d.setDate(d.getDate()-1);while(h.d.includes(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function ha(n){n=String(n||"").trim();if(n){S.habits.push({n,d:[],r:[]});save();draw()}}
function hd(i){const h=S.habits[i],k=dk();if(h.d.includes(k))h.d=h.d.filter(x=>x!=k);else{h.d.push(k);if(!h.r.includes(k)){h.r.push(k);addXp(5)}}save();draw()}
// ===== Profile & subpages =====
function profile(){
 if(sub=="dict")return dict();if(sub=="look")return look();if(sub=="set")return sett();
 const c=cefr(),tot=S.ok+S.bad,gt=S.gok+S.gbad,dn=dnDone();
 const sk=[tot?S.ok/tot:0,Math.min(1,S.words.length/50),Math.min(1,S.msgs/30),dn/10,gt?S.gok/gt:0].map(x=>Math.round(Math.min(1,x)*100));
 const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,ph=u&&u.photo_url,nm=userName();
 return`<div class="ctr" style="margin-top:6px">${ph?`<img src="${esc(ph)}" class="av" alt="">`:`<div class="av" style="display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--ac)">${esc((nm||"Z")[0].toUpperCase())}</div>`}<input value="${esc(S.name)}" placeholder="${t("yourname")}${u?" ("+esc(u.first_name)+")":""}" style="text-align:center;font-size:20px;font-weight:700;background:none;border:0" onchange="S.name=this.value.trim();save()"><div class="mu">${t("studying")} · ${flag("en",16)}</div></div>
<div class="hero"><div class="row sb" style="align-items:flex-end"><div class="big" style="color:var(--ac)">${c.n}</div><div class="mu">${S.xp} / ${c.b} XP</div></div><div class="bar" style="margin-top:8px"><i style="width:${c.p}%"></i></div></div>
<div class="row" style="margin:10px 0;flex-wrap:nowrap"><div class="c ctr" style="flex:1;margin:0"><h1>${streak()}🔥</h1><div class="mu">${t("streak")}</div></div><div class="c ctr" style="flex:1;margin:0"><h1>${S.words.length}</h1><div class="mu">${t("wd")}</div></div><div class="c ctr" style="flex:1;margin:0"><h1>${tot?Math.round(S.ok/tot*100)+"%":"–"}</h1><div class="mu">${t("acc")}</div></div></div>
<div class="c"><b>${t("skills")}</b>${t("sk").map((n,i)=>`<div class="row sb" style="margin-top:8px"><span>${n}</span><span class="mu">${sk[i]}%</span></div><div class="bar"><i style="width:${sk[i]}%"></i></div>`).join("")}</div>
<button class="cc" onclick="go('profile','dict')">🗂 ${t("dict")}<span style="flex:1"></span>›</button><button class="cc" onclick="go('profile','look')">🎨 ${t("look")}<span style="flex:1"></span>›</button><button class="cc" onclick="go('profile','set')">⚙️ ${t("settings")}<span style="flex:1"></span>›</button>
<div class="c"><b>7</b>${chart(7)}<b>30</b>${chart(30)}</div><div class="c"><b>${t("errs")}</b>${Object.entries(S.err).map(([k,v])=>`<div>${esc(k)} ×${v}</div>`).join("")||"–"}</div>`}
// ----- Dictionary (spaced repetition) -----
function wl(){const q=hq.toLowerCase(),td=dk();
 const r=S.words.map((w,i)=>[w,i]).filter(([w])=>(!q||(w.w+" "+w.tr).toLowerCase().includes(q))&&(hf=="all"||(hf=="new"&&!w.st)||(hf=="learn"&&w.st&&w.due>td)||(hf=="rev"&&w.due<=td)));
 return r.map(([w,i])=>`<div class="c row sb" style="margin:5px 0;padding:10px 12px;flex-wrap:nowrap"><div style="min-width:0"><button class="sp" style="padding:0 8px 0 0" onclick="speak(S.words[${i}].w)">🔊</button><b>${esc(w.w)}</b> — ${esc(w.tr)}<div class="mu">${esc(w.ex||"")}</div></div><div style="text-align:right;white-space:nowrap"><span class="pill ${w.due<=td?"p-rev":w.st?"p-learn":"p-new"}">${w.due<=td?t("brev"):w.st?t("blearn"):t("bnew")}</span><div class="mu">${w.int}d <button class="sp" onclick="delW(${i})">✕</button></div></div></div>`).join("")||`<div class="mu">${t("nowords")}</div>`}
function dict(){const td=dk(),dues=S.words.filter(w=>w.due<=td),di=S.words.findIndex(w=>w.due<=td),w=S.words[di];
 return`<button class="g" onclick="go('profile')">← ${t("profile")}</button><h2>${t("dict")}</h2><div class="mu">${t("due")}: ${dues.length}</div>${w?`<div class="c ctr"><h1>${esc(w.w)} <button class="sp" onclick="speak(S.words[${di}].w)">🔊</button></h1>${shown?`<p>${esc(w.tr)}</p><p class="mu">${esc(w.ex||"")}</p><div class="row" style="justify-content:center"><button class="g" onclick="rate(${di},0)">${t("dk")}</button><button onclick="rate(${di},1)">${t("know")}</button></div>`:`<button onclick="shown=true;draw()">${t("show")}</button>`}</div>`:`<div class="c mu">${t("nodue")}</div>`}
<input placeholder="🔍 ${t("dsearch")}" value="${esc(hq)}" oninput="hq=this.value;$('wl').innerHTML=wl()"><div class="row" style="margin:6px 0">${[["all","f_all"],["new","f_new"],["learn","f_learn"],["rev","f_rev"]].map(([k,l])=>`<button class="chip ${hf==k?"on":""}" onclick="hf='${k}';draw()">${t(l)}</button>`).join("")}</div>
<div id="wl">${wl()}</div>
<div class="c"><b>${t("add")}</b><input id="nw" placeholder="${t("w")}"><input id="nt" placeholder="${t("tr")}"><input id="ne" placeholder="${t("exs")}"><button onclick="addW()">${t("add")}</button></div>`}
function rate(i,k){const x=S.words[i];if(!x)return;x.st=1;if(k){x.int=Math.min(60,x.int*2)}else{x.int=1;x.err=(x.err||0)+1}const d=new Date();d.setDate(d.getDate()+x.int);x.due=dk(d);shown=false;save();draw()}
function addW(){const w=$("nw").value.trim(),tr=$("nt").value.trim();if(!w||!tr)return;if(!S.words.find(x=>x.w==w))S.words.push({w,tr,ex:$("ne").value.trim(),due:dk(),int:1,err:0,st:0});save();draw()}
function delW(i){S.words.splice(i,1);save();draw()}
// ----- Appearance -----
function look(){const sel=pv||S.th,ac=pa!==null?pa:S.ac,cc=ac||TH[sel][5];
 return`<button class="g" onclick="go('profile')">← ${t("profile")}</button><h2>${t("themes")}</h2><div class="row">${Object.entries(TH).map(([k,x])=>`<button class="th c" style="background:${x[2]};color:${x[3]};border-color:${sel==k?x[5]:x[6]}" onclick="pv='${k}';pa='';theme('${k}','');draw()"><b style="color:${x[5]}">●</b> ${x[0]}</button>`).join("")}</div>
<h2>${t("accent")}</h2><div class="row">${SWATCH.map(s=>`<button class="sw" style="background:${s};${cc.toLowerCase()==s?"border-color:var(--tx)":""}" onclick="pa='${s}';theme(pv||S.th,'${s}');draw()"></button>`).join("")}<input type="color" value="${esc(cc.length==7?cc:"#e0b030")}" style="width:46px;padding:2px;margin:0" oninput="pa=this.value;theme(pv||S.th,this.value)"></div>
<h2>${t("preview")}</h2><div class="hero ctr"><svg viewBox="0 0 100 100" width="44" height="44"><path d="M10 12H90V30L40 70H90V88H10V70L60 30H10Z" fill="var(--ac)"/></svg><div class="big" style="font-size:30px">ZEST <b style="color:var(--ac)">AI</b></div><div class="mu">Learn · Speak · Grow</div></div>
<button class="full" onclick="S.th=pv||S.th;if(pa!==null)S.ac=pa;save();go('profile','look')">${t("apply")}</button>`}
// ----- Settings -----
function sett(){return`<button class="g" onclick="go('profile')">← ${t("profile")}</button><h2>${t("settings")}</h2>
<div class="c"><b>${t("ui")}</b><div class="row" style="margin-top:6px">${[["ru","Русский"],["en","English"],["zh","中文"]].map(([c,l])=>`<button class="${S.lg==c?"":"g"}" onclick="S.lg='${c}';save();draw()">${l}</button>`).join("")}</div></div>
<div class="c row sb"><span>${t("sound")}</span><button class="${S.snd?"":"g"}" onclick="S.snd=S.snd?0:1;save();draw()">${S.snd?"ON":"OFF"}</button></div>
<button class="g full" style="margin:6px 0" onclick="S.chat=[];save();draw()">${t("clr")}</button>
<button class="g full" style="margin:6px 0;color:#e74c3c;border-color:#e74c3c" onclick="if(confirm('?')){localStorage.removeItem('zest');location.reload()}">${t("reset")}</button>
<div class="c mu ctr">ZEST AI · ${t("about")} · v2</div>`}
theme(S.th,S.ac);draw();
</script></body></html>
